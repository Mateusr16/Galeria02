<!DOCTYPE html>
<!--
  GALERIA 02 — ÁLBUM DE FOTOGRAFIA (esqueleto da página).
  Você normalmente NÃO precisa mexer aqui.
    • Textos, nomes e data ........ config.js
    • Fotos, vídeos e música ...... pastas dentro de "assets" + duplo clique em atualizar-galeria.bat
    • Visual (cores, papel, capa) . assets/css/style.css
  Leia o manual.html para o passo a passo.
-->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#161b12">
<title>Álbum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<!-- O álbum é montado pelo app.js dentro desta área -->
<div class="stage" id="stage">
  <div class="book-wrap">
    <div class="book closed" id="book">
      <div class="board"></div>
      <div class="slot l" id="slotL"><div class="shd"></div></div>
      <div class="slot r" id="slotR"><div class="shd"></div></div>
    </div>
  </div>
</div>

<!-- Tela inicial: botão para abrir -->
<div class="open-area" id="openArea">
  <button class="open-btn" id="openBtn">Abrir Álbum ↗</button>
  <div class="music-hint" id="introHint">♪ ♫ ♪</div>
</div>

<!-- Depois de aberto: voltar / seguir -->
<nav class="controls" id="controls">
  <button class="nav" id="prevBtn">‹ Voltar</button>
  <span class="counter" id="counter"></span>
  <button class="nav" id="nextBtn">Seguir ›</button>
</nav>

<button class="music hide" id="musicBtn" aria-label="Ligar ou desligar a música">
  <span class="eq"><i></i><i></i><i></i><i></i></span><span id="musicLabel">Música</span>
</button>
<div class="toast" id="toast">Link copiado!</div>

<!-- Ordem importa: 1) suas configurações  2) lista de arquivos (gerada)  3) o código da página -->
<script src="config.js"></script>
<script src="assets/js/galeria.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
